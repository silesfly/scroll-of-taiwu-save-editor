<!DOCTYPE html>
<html lang="ko" data-hyup-skin="m1" data-hyup-slug="scroll-of-taiwu">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'unsafe-inline'; style-src 'unsafe-inline'; img-src data:; connect-src 'self'; font-src 'none';">
<title>태오회권 세이브 에디터</title>
<style>
*,*::before,*::after{box-sizing:border-box}
:root{--bg:#101319;--panel:#181c25;--panel2:#222838;--line:#2d3547;--fg:#e8ecf6;--muted:#98a2b8;--accent:#7f9dff;--accent2:#4a67e8;--warn:#ffb454}
html,body{margin:0;min-height:100%}
body{background:var(--bg);color:var(--fg);font:14px/1.55 "맑은 고딕","Malgun Gothic",system-ui,sans-serif}
h1,h2,p,ul{margin:0}
ul{padding:0;list-style:none}
button{font:inherit;color:inherit;cursor:pointer;background:var(--panel2);border:1px solid var(--line);border-radius:8px;padding:6px 12px;transition:border-color .12s,background .12s}
button:hover{border-color:var(--accent)}
button:focus-visible,input:focus-visible,select:focus-visible,.dropzone:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
button.primary{background:var(--accent2);border-color:var(--accent2);color:#fff;font-weight:600}
[hidden]{display:none!important}
.sr-only{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
.topbar{position:sticky;top:0;z-index:50;display:flex;flex-wrap:wrap;align-items:center;gap:8px;padding:10px 16px;background:rgba(16,19,25,.94);border-bottom:1px solid var(--line);backdrop-filter:blur(8px)}
.brand{display:flex;align-items:center;gap:8px;margin-right:auto;font-weight:700;font-size:15px}
.mark{display:grid;place-items:center;width:24px;height:24px;border-radius:7px;background:var(--accent2);color:#fff;font-size:12px}
.badge{font-size:11px;font-weight:600;color:var(--accent);background:var(--panel2);border:1px solid var(--line);border-radius:999px;padding:2px 8px}
#dirty-badge{font-size:11px;font-weight:600;color:#0d1017;background:var(--warn);border-radius:999px;padding:2px 8px}
.actions{display:flex;flex-wrap:wrap;gap:6px}
.slot-bar{display:flex;align-items:center;gap:6px;font-size:12px;color:var(--muted)}
select,input[type=search],input[type=number],input[type=text]{font:inherit;font-size:13px;color:var(--fg);background:var(--panel2);border:1px solid var(--line);border-radius:8px;padding:6px 10px}
.wrap{max-width:980px;margin:0 auto;padding:32px 16px}
.card{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:24px}
.hero h1{font-size:22px;margin-bottom:8px}
.lead{color:var(--muted);max-width:62ch}
.dropzone{display:flex;flex-direction:column;gap:6px;align-items:center;justify-content:center;text-align:center;margin:20px 0;padding:28px 16px;border:2px dashed var(--line);border-radius:12px;background:var(--panel2);color:var(--muted);cursor:pointer}
.dropzone strong{color:var(--fg);font-size:15px}
.dropzone.is-over{border-color:var(--accent);background:#26304a}
.hero-actions{display:flex;flex-wrap:wrap;gap:8px}
.hint{margin-top:18px;display:grid;gap:4px;font-size:12px;color:var(--muted)}
.hint li::before{content:"· ";color:var(--accent)}
.layout{display:grid;grid-template-columns:290px minmax(0,1fr);gap:14px;padding:14px;align-items:start}
.sidebar{display:flex;flex-direction:column;gap:10px;background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:12px;position:sticky;top:62px;max-height:calc(100vh - 78px)}
.summary{display:grid;gap:4px;font-size:12px}
.s-row{display:flex;justify-content:space-between;gap:8px}
.s-label{color:var(--muted)}
.s-value{font-weight:600;text-align:right;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.side-tools{display:flex;flex-direction:column;gap:6px}
.side-tools input[type=search]{width:100%}
.check{display:flex;align-items:center;gap:6px;font-size:12px;color:var(--muted);cursor:pointer}
.char-list{flex:1;overflow:auto;display:flex;flex-direction:column;gap:2px;min-height:120px}
.char-list button{width:100%;display:flex;justify-content:space-between;gap:8px;text-align:left;font-size:13px;padding:6px 8px;background:transparent;border:1px solid transparent}
.char-list button:hover{background:var(--panel2)}
.char-list button[aria-selected="true"]{background:var(--panel2);border-color:var(--accent);color:#fff}
.char-list .meta{color:var(--muted);font-size:11px}
.main-panel{display:flex;flex-direction:column;min-height:420px;background:var(--panel);border:1px solid var(--line);border-radius:12px;overflow:hidden}
.tabs{display:flex;flex-wrap:wrap;gap:4px;padding:8px;border-bottom:1px solid var(--line);background:var(--panel2)}
.tab-btn{font-size:13px;padding:6px 10px;background:transparent;border-color:transparent}
.tab-btn[aria-selected="true"]{background:var(--panel);border-color:var(--accent);color:#fff;font-weight:600}
#tab-content{flex:1;overflow:auto;padding:16px}
#tab-content h2{font-size:16px;margin-bottom:10px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(190px,1fr));gap:10px;margin-bottom:16px}
.field{display:flex;flex-direction:column;gap:4px;background:var(--panel2);padding:8px 10px;border-radius:8px;border:1px solid var(--line)}
.field label{font-size:12px;color:var(--muted)}
.row-actions{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:12px}
table{width:100%;border-collapse:collapse;font-size:13px;margin-bottom:14px}
th,td{padding:6px 8px;border-bottom:1px solid var(--line);text-align:left}
th{color:var(--muted);font-weight:600}
.chip-list{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:12px}
.chip{display:inline-flex;align-items:center;gap:6px;padding:4px 9px;border-radius:999px;background:var(--panel2);border:1px solid var(--line);font-size:12px}
.chip button{padding:0 5px;font-size:11px;border-radius:999px}
.preset-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(240px,1fr));gap:10px;margin-bottom:16px}
.preset-card{display:flex;flex-direction:column;gap:6px;background:var(--panel2);border:1px solid var(--line);border-radius:10px;padding:12px}
#toast{position:fixed;left:50%;bottom:20px;transform:translateX(-50%);z-index:100;max-width:min(90vw,460px);padding:10px 16px;font-size:13px;border-radius:10px;background:#252c3c;border:1px solid var(--accent);box-shadow:0 10px 30px rgba(0,0,0,.45)}
@media (max-width:820px){.layout{grid-template-columns:1fr}.sidebar{position:static;max-height:none}}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>

  html[data-hyup-skin="m1"]::-webkit-scrollbar-thumb,
  html[data-hyup-skin="m1"] *::-webkit-scrollbar-thumb {
    background: var(--hyup-sb-thumb);
    border-radius: 6px;
    border: 2px solid var(--hyup-sb-track);
  }
}

@media (prefers-reduced-motion: reduce) {
  html[data-hyup-skin="m1"] *,
  html[data-hyup-skin="m1"] *::before,
  html[data-hyup-skin="m1"] *::after {
    scroll-behavior: auto !important;
    animation-duration: 0.01ms !important;
    animation-iteration-count: 1 !important;
    transition-duration: 0.01ms !important;
  }
}

@media (forced-colors: active) {
  html[data-hyup-skin="m1"] :focus-visible {
    outline-color: Highlight;
  }
}
</style>
</head>
<body>
<header class="topbar">
  <div class="brand">
    <span class="mark" aria-hidden="true">태</span>
    <span>태오회권 세이브 에디터</span>
    <span class="badge">아카이브 v4</span>
    <span id="dirty-badge" hidden>변경 0건</span>
  </div>
  <div class="actions">
    <button type="button" data-action="load-demo">데모 불러오기</button>
    <button type="button" data-action="open-files">파일 열기</button>
    <button type="button" data-action="export-json">JSON 내보내기</button>
    <button type="button" class="primary" data-action="save-files">저장하기</button>
  </div>
  <div id="server-slot-bar" class="slot-bar" hidden>
    <label for="slot-select">서버 슬롯</label>
    <select id="slot-select"></select>
    <button type="button" data-action="load-server-slot">슬롯 불러오기</button>
  </div>
  <input id="file-input" type="file" multiple accept=".sav" hidden>
</header>

<main id="welcome-panel" class="wrap">
  <section class="card hero">
    <h1>태오회권 세이브 에디터</h1>
    <p class="lead">지역 세이브와 전역 세이브를 불러와 인물의 능력치, 자질, 소지품, 무공과 세계 기록을 한자리에서 확인하고 고칩니다.</p>
    <div id="dropzone" class="dropzone" tabindex="0" role="button" aria-label="세이브 파일을 여기에 놓거나 눌러서 선택하세요">
      <strong>세이브 파일을 여기에 끌어다 놓으세요</strong>
      <span>지역 세이브와 전역 세이브를 함께 선택할 수 있습니다.</span>
    </div>
    <div class="hero-actions">
      <button id="btn-demo" type="button" class="primary" data-action="load-demo">데모 저장 불러오기</button>
      <button id="btn-open" type="button" data-action="open-files">파일 열기</button>
    </div>
    <ul class="hint">
      <li>모든 처리는 이 브라우저 안에서만 이루어지며 파일이 외부로 전송되지 않습니다.</li>
      <li>저장하면 원본 파일을 덮어쓰므로 먼저 백업해 두세요.</li>
    </ul>
  </section>
</main>

<div id="workspace-panel" class="layout" hidden>
  <aside class="sidebar" aria-label="인물 목록">
    <div id="summary-bar" class="summary" aria-label="요약 정보">
      <div class="s-row"><span class="s-label">대표 인물</span><span class="s-value" id="sum-hero">없음</span></div>
      <div class="s-row"><span class="s-label">진행 시점</span><span class="s-value" id="sum-date">-</span></div>
      <div class="s-row"><span class="s-label">세대</span><span class="s-value" id="sum-generation">-</span></div>
      <div class="s-row"><span class="s-label">인물 수</span><span class="s-value" id="sum-chars">0</span></div>
      <div class="s-row"><span class="s-label">변경 수</span><span class="s-value" id="sum-dirty">0</span></div>
    </div>
    <div class="side-tools">
      <label class="sr-only" for="char-search">인물 검색</label>
      <input id="char-search" type="search" placeholder="이름으로 검색" autocomplete="off">
      <label class="check"><input id="filter-village" type="checkbox"> 마을 인물만 보기</label>
    </div>
    <ul id="char-list" class="char-list" role="listbox" aria-label="인물 목록"></ul>
  </aside>

  <section class="main-panel" aria-label="편집 영역">
    <div class="tabs" role="tablist" aria-label="편집 항목">
      <button type="button" class="tab-btn" role="tab" data-tab="stats" aria-selected="true">기본·속성</button>
      <button type="button" class="tab-btn" role="tab" data-tab="qual" aria-selected="false">자질·특성</button>
      <button type="button" class="tab-btn" role="tab" data-tab="items" aria-selected="false">자원·소지품</button>
      <button type="button" class="tab-btn" role="tab" data-tab="skills" aria-selected="false">무공·기예</button>
      <button type="button" class="tab-btn" role="tab" data-tab="world" aria-selected="false">세계·전승</button>
      <button type="button" class="tab-btn" role="tab" data-tab="diff" aria-selected="false">프리셋·변경내역</button>
    </div>
    <div id="tab-content" role="tabpanel" tabindex="0"></div>
  </section>
</div>

<div id="toast" role="status" aria-live="polite" hidden></div>

<!-- INLINE_SCRIPTS -->
<script src="taiwu-deflate.js"></script>
<script src="taiwu-wire.js"></script>
<script src="taiwu-codec.js"></script>
<script src="catalog-data.js"></script>
<script src="editor-core.js"></script>
<script src="editor-ui.js"></script>
</body>
</html>
